on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  test:
    if: github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      # If failure occurs on one OS, it is still relevant to see which others may work
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]

    steps:
      - name: Github Actor Info
        run: |
          echo "Workflow triggered by github actor ${{ github.actor }}"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout
        uses: actions/checkout@v3

      - name: Activate Cache for pip
        uses: actions/cache@v3
        id: cache-python-env
        with:
          path: ${{ env.pythonLocation }}
          key: "v3-${{ env.pythonLocation }}-${{ hashFiles('setup.py') }}"

      - name: Update pip and friends
        run: |
          python -m pip install --upgrade pip setuptools wheel
        if: steps.cache-python-env.outputs.cache-hit != 'true'

      - name: Cache TA-lib dependencies
        uses: actions/cache@v3
        id: cache-talib
        with:
          path: |
            ${{ github.workspace }}/dependencies
            ${{ env.pythonLocation }}/lib/python*/site-packages/TA_Lib*
          key: talib-${{ runner.os }}-${{ hashFiles('**/setup.py') }}
          restore-keys: |
            talib-${{ runner.os }}-

      - name: Install TA-lib (if not cached)
        if: steps.cache-talib.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget https://raw.githubusercontent.com/mrjbq7/ta-lib/TA_Lib-0.6.3/tools/build_talib_from_source.bash
          chmod +x build_talib_from_source.bash
          ./build_talib_from_source.bash $DEPS_PATH
          python -m pip install TA-lib
        env:
          DEPS_PATH: ${{ github.workspace }}/dependencies
          TA_INCLUDE_PATH: ${{ github.workspace }}/dependencies/include
          TA_LIBRARY_PATH: ${{ github.workspace }}/dependencies/lib

      - name: Install pandas-ta
        run: |
          python -m pip install ".[test]"

      - name: Run tests
        shell: bash
        run: |
          make tests

  publish:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' # Only run on push to development
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pandas-ta-ff137
    permissions:
      id-token: write # Note: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and publish dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine

      - name: Build package
        run: |
          python setup.py sdist bdist_wheel

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
